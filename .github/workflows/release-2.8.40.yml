name: Publish PlumBox 2.8.40

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.40.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.40
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.40"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.40.zip
          unzip -t plumbox-2.8.40.zip
          sha256sum plumbox-2.8.40.zip > plumbox-2.8.40.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.40

          - W menu Historia temperatur dodano dolną oś z godzinami HH:MM. Przy danych obejmujących różne dni pod godzinami pojawia się data.
          - Liczba podpisów dopasowuje się do szerokości wykresu; na telefonie podpisów jest mniej. Godziny odnoszą się do tych samych próbek co linie i podpowiedzi.
          - Usunięto napis Lokalny panel ecoMAX · V3 Native ze stopki menu bocznego.

          Walidacja: rysowanie godzin i dat na szerokim i wąskim wykresie, poprawne położenie podpisów i usunięcie napisu stopki.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.40.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.40 >/dev/null 2>&1; then
            echo "Release v2.8.40 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.40 plumbox-2.8.40.zip plumbox-2.8.40.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.40" \
            --notes-file release-notes.md \
            --latest


