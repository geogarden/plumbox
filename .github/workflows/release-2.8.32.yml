name: Publish PlumBox 2.8.32

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.32.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.32
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.32"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.32.zip
          unzip -t plumbox-2.8.32.zip
          sha256sum plumbox-2.8.32.zip > plumbox-2.8.32.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.32

          - W schemacie instalacji dodano pomarańczowy odczyt SPALINY między temperaturą zewnętrzną a stanem pracy kotła.
          - Odczyt aktualizuje się ze sterownika i pokazuje jedno miejsce po przecinku.
          - Brak danych jest oznaczony kreską; pozostałe odczyty i zdjęcie kotła zachowano.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.32.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.32 >/dev/null 2>&1; then
            echo "Release v2.8.32 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.32 plumbox-2.8.32.zip plumbox-2.8.32.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.32" \
            --notes-file release-notes.md \
            --latest


