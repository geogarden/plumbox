name: Publish PlumBox 2.8.29

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.29.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.29
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.29"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.29.zip
          unzip -t plumbox-2.8.29.zip
          sha256sum plumbox-2.8.29.zip > plumbox-2.8.29.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.29

          - W podsumowaniu H1/H2 kafelki MAX, średnia i minimalna pokazują czas pracy podajnika w sekundach zamiast niedostępnej mocy w kW.
          - Dane pochodzą z parametrów fuel_feeding_work_100, fuel_feeding_work_50 i fuel_feeding_work_30.
          - Zachowano progi temperatury H1/H2. Brak odczytu pozostaje oznaczony jako „—”; zero nie jest traktowane jako brak danych.

          Sprawdzono testy JavaScript, spójność wydania i wyświetlanie w przeglądarce z przykładowymi danymi sterownika.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.29.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.29 >/dev/null 2>&1; then
            echo "Release v2.8.29 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.29 plumbox-2.8.29.zip plumbox-2.8.29.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.29" \
            --notes-file release-notes.md \
            --latest

