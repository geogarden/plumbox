name: Publish PlumBox 2.8.31

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.31.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.31
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.31"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.31.zip
          unzip -t plumbox-2.8.31.zip
          sha256sum plumbox-2.8.31.zip > plumbox-2.8.31.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.31

          - Czujnik MQTT „PlumBox Exhaust temp” otrzymał nazwę „PlumBox Temperatura spalin”.
          - Temperatura spalin i temperatura zewnętrzna są publikowane z dokładnością do jednego miejsca po przecinku.
          - Zaokrąglenie obejmuje kanały value, raw, entity oraz stan JSON; dane panelu i historii pozostają w oryginalnej dokładności.
          - Discovery ustawia jednostkę °C, klasę temperatury i sugerowaną precyzję wyświetlania 1.
          - Zachowano identyfikatory i tematy czujników, aby utrzymać istniejące encje Home Assistant.

          Zweryfikowano publikację obu czujników, temperatury ujemne, zero, pełne stopnie i brak odczytu.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.31.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.31 >/dev/null 2>&1; then
            echo "Release v2.8.31 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.31 plumbox-2.8.31.zip plumbox-2.8.31.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.31" \
            --notes-file release-notes.md \
            --latest


