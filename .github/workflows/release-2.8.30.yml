name: Publish PlumBox 2.8.30

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.30.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.30
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.30"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.30.zip
          unzip -t plumbox-2.8.30.zip
          sha256sum plumbox-2.8.30.zip > plumbox-2.8.30.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.30

          - Dodano Auto do wyboru sezonowego trybu pracy kotła.
          - Dostępne etykiety to Zima (0), Lato (1) i Auto (2), zgodnie z natywnym parametrem summer_mode.
          - Zakładka i parametr noszą teraz nazwę „Lato / Zima / Auto”.
          - Zachowano kontrolę zakresu odczytanego ze sterownika, PIN i potwierdzanie zapisu odczytem.

          Sprawdzono serializację wszystkich trzech trybów, wybór Auto w formularzu oraz spójność wydania.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.30.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.30 >/dev/null 2>&1; then
            echo "Release v2.8.30 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.30 plumbox-2.8.30.zip plumbox-2.8.30.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.30" \
            --notes-file release-notes.md \
            --latest


