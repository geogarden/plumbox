name: Publish PlumBox 2.8.28

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.28.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.28
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.28"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.28.zip
          unzip -t plumbox-2.8.28.zip
          sha256sum plumbox-2.8.28.zip > plumbox-2.8.28.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.28

          - Dodano boczne menu „Praca wg harmonogramu” pod „CO i kocioł”.
          - Plan tygodniowy ma 48 półgodzinnych pól na każdy dzień, stany praca dozwolona/przerwa i włącznik harmonogramu.
          - Zapis trafia do sterownika przez PyPlumIO; plan działa niezależnie od otwartej przeglądarki.
          - Wymagane są konto administratora, odblokowanie sterowania zgodnie z konfiguracją PIN i potwierdzenie.
          - Sukces wymaga świeżego, zgodnego odczytu. Zmieniony równolegle plan nie jest nadpisywany; niepotwierdzony zapis nie jest automatycznie ponawiany.
          - Dostosowano układ do komputerów, tabletów i telefonów.

          Walidacja: testy Pythona i JavaScript oraz test przeglądarkowy edycji i zapisu z symulowanymi odpowiedziami sterownika. Weryfikacja na fizycznym kotle pozostaje po instalacji.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.28.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.28 >/dev/null 2>&1; then
            echo "Release v2.8.28 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.28 plumbox-2.8.28.zip plumbox-2.8.28.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.28" \
            --notes-file release-notes.md \
            --latest

