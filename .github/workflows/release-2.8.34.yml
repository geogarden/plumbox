name: Publish PlumBox 2.8.34

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.34.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.34
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.34"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.34.zip
          unzip -t plumbox-2.8.34.zip
          sha256sum plumbox-2.8.34.zip > plumbox-2.8.34.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.34

          - Temperatura kotła current_temp jest publikowana z dokładnością do dwóch miejsc po przecinku we wszystkich kanałach MQTT i stanie JSON.
          - Home Assistant MQTT Discovery sugeruje dwa miejsca po przecinku dla czujnika. Zachowano nazwę, tematy i unique_id.
          - Temperatura spalin i zewnętrzna nadal mają jedno miejsce po przecinku.

          Walidacja: testy payloadów MQTT, precyzji Discovery, zachowania tożsamości czujnika i niezmieniania oryginalnego odczytu.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.34.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.34 >/dev/null 2>&1; then
            echo "Release v2.8.34 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.34 plumbox-2.8.34.zip plumbox-2.8.34.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.34" \
            --notes-file release-notes.md \
            --latest


