name: Publish PlumBox 2.8.27

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-2.8.27.yml

permissions:
  contents: write

concurrency:
  group: release-2.8.27
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 7e3744968ae784bdca8d5baf8f3feba1db37f11f
    steps:
      - name: Prepare versioned source package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GH_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          grep -qx 'version: "2.8.27"' source/plumbox/config.yaml
          git -C source archive --format=zip --prefix=plumbox/ HEAD:plumbox > plumbox-2.8.27.zip
          unzip -t plumbox-2.8.27.zip
          sha256sum plumbox-2.8.27.zip > plumbox-2.8.27.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## PlumBox 2.8.27

          - Naprawiono wykrywanie aktualizacji w Home Assistant przez standardowe numerowanie wersji.
          - Osiem kafelków na ekranie głównym mieści się w dwóch rzędach po cztery na komputerze.
          - Zachowano widok responsywny dla tabletów i telefonów.
          - Wydanie zawiera dotychczasowe zmiany panelu ecoMAX 860P4-LZ i schematu kotła Lazar SF 11/130.

          ### Aktualizacja
          W Home Assistant odśwież sklep aplikacji i zaktualizuj PlumBox z repozytorium GitHub. Zachowaj dane i konfigurację aplikacji.

          Paczka plumbox-2.8.27.zip zawiera folder plumbox do instalacji ręcznej. Plik .sha256 pozwala sprawdzić integralność pobranego archiwum.
          NOTES
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.8.27 >/dev/null 2>&1; then
            echo "Release v2.8.27 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v2.8.27 plumbox-2.8.27.zip plumbox-2.8.27.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title "PlumBox 2.8.27" \
            --notes-file release-notes.md \
            --latest
